<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autofuse Fuzz · 离线结果</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<header><div><span class="eyebrow">AUTOFUSE FUZZ</span><h1>离线结果</h1></div><span class="badge">只读 · 本机查看</span></header>
<main>
<p class="intro">按 seed 检索结果，查看各 shape 指标并复制重放命令。查看不会运行模型或上传数据。</p>
<section class="cards" aria-label="结果概览"><div><span>实验记录</span><strong id="total">—</strong></div><div><span>通过</span><strong id="ok">—</strong></div><div><span>精度失败</span><strong id="fail">—</strong></div><div><span>异常 / 不支持</span><strong id="errors">—</strong></div></section>
<form id="filters"><label>Seed <input name="seed" placeholder="例如 42" inputmode="numeric" autocomplete="off"></label><label>状态 <select name="status"><option value="">全部状态</option value="ok">通过</option><option value="fail">精度失败</option><option value="error">异常</option><option value="unsupported">不支持</option></select></label><button type="submit">筛选</button><button id="reset-filters" type="button" class="secondary">重置</button></form>
<p id="message" role="status" aria-live="polite"></p>
<section class="panel"><div class="table-scroll"><table><thead><tr><th>Seed</th><th>后端 / 来源</th><th>状态</th><th>时间</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="page-label">每页 50 条</span><div><button id="previous" class="secondary" disabled>上一页</button><button id="next" disabled>下一页</button></div></div></section>
<section class="panel detail" id="detail" hidden><h2>实验详情</h2><label class="command">重放命令 <input id="command" readonly></label><button id="copy">复制命令</button> <button id="compare" class="secondary">对比同 seed 结果</button><p id="detail-message" role="status"></p><pre id="detail-content"></pre></section>
<section class="panel detail" id="comparison" hidden><h2>后端对比</h2><p id="comparison-message" role="status"></p><pre id="comparison-content"></pre></section>
<footer>CPU wall-time 与 NPU kernel profiler 不可混用。不同环境或执行配置的指标不自动视为可比。</footer>
</main></body></html>
