<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备与任务管理 · Autofuse</title><link rel="stylesheet" href="/manage.css"><script src="/session.js" defer></script><script src="/manage.js" defer></script></head><body><header><a href="/">Autofuse</a><h1>设备与任务管理</h1><span id="session-controls"></span></header><main><p>客户端只需安装 wheel 并启动守护进程。远程安装仅使用设备所有者在本机授权的方案。</p><p id="notice" role="status">请先登录</p><section><h2>绑定新设备</h2><form id="pair"><label>客户端配对码 <input id="code" required maxlength="20" autocomplete="off"></label><button>确认绑定</button></form></section><section><h2>我的设备</h2><button id="refresh">刷新</button><select id="devices" aria-label="选择设备"></select><pre id="device-state"></pre></section><section><h2>配置与操作</h2><label>操作 <select id="kind"><option value="environment.inspect">检测环境</option><option value="environment.plan">预览环境安装计划</option><option value="environment.apply">执行已确认安装计划</option><option value="build.submit">本地源码构建</option><option value="task.validate">校验任务</option><option value="task.submit">启动任务</option><option value="task.reconfigure">持续任务安全更新参数</option><option value="task.action">暂停 / 恢复 / 停止任务</option><option value="operation.cancel">取消安装 / 构建操作</option><option value="tool.stage">预安装签名工具版本</option><option value="tool.activate">切换已验证工具版本</option><option value="config">发布客户端策略</option></select></label><p>填写 YAML 或 JSON；安装操作先创建计划，再填入 plan_id 执行。更改配置只对新任务生效。</p><div class="form-toolbar"><button type="button" id="new-task">任务表单</button><button type="button" id="new-environment">环境表单</button><button type="button" id="new-policy">策略表单</button><button type="button" id="form-to-editor">表单 → 编辑器</button><button type="button" id="editor-to-form">编辑器 → 表单</button></div><div id="schema-form"></div><label>配置模板<select id="templates"><option value="">选择模板</option></select></label><label>保存模板名称<input id="template-name" maxlength="80"></label><button id="save-template">保存新修订</button><button id="export-config">导出配置</button><label>配置编辑器<textarea id="spec" spellcheck="false" rows="18">{}</textarea></label><button id="validate">校验配置</button><button id="submit">提交操作</button><pre id="preview"></pre></section><section><h2>设备历史与安全</h2><button id="history">配置历史</button><button id="audit">审计记录</button><button id="revoke">撤销设备凭据</button><pre id="history-view"></pre></section><section><h2>操作进度</h2><p>“已提交”不代表“已完成”；断线期间停止指令可能尚未送达。</p><div id="operations"></div></section></main></body></html>
