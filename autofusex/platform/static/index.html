<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutofuseX 平台</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top" id="top">
  <div class="brand"><img src="favicon.svg" alt="">AutofuseX</div>
  <nav class="main" id="nav">
    <a href="#overview" data-page="overview">总览</a>
    <a href="#discovery" data-page="discovery">问题发现</a>
    <a href="#repair" data-page="repair">修复闭环</a>
    <a href="#knowledge" data-page="knowledge">知识库</a>
    <a href="#profile" data-page="profile">能力画像</a>
    <a href="#ops" data-page="ops">平台运维</a>
    <a href="#models" data-page="models" class="disabled">整网分析</a>
  </nav>
  <form class="search" id="search-form">
    <input id="search" placeholder="搜索，如 backend:af-mlir status:fail category:reduce error:tiling" autocomplete="off" maxlength="256">
    <button type="submit">搜索</button>
  </form>
  <div class="who" id="who"></div>
  <button id="refresh" class="icon-btn" title="刷新当前页（不回到顶部）">刷新</button>
  <button id="logout" class="icon-btn">登录</button>
</header>
<main id="main"></main>
<div id="drawer" class="drawer hidden"></div>
<div id="actionbar" class="actionbar hidden"></div>
</body>
</html>
