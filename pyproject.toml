[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autofusedebugger"
version = "0.1.0"
description = "CPU vs native Inductor NPU Autofuse per-kernel accuracy debugger"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.scripts]
autofusedbg = "autofusedebugger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autofusedebugger*"]
