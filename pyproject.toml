[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autofusex"
version = "0.1.3"
description = "Autofuse debugging and reproducible CPU/NPU fuzz testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.18,<5", "cryptography>=41"]

[project.optional-dependencies]
execution = [
  "numpy",
  "nnsmith @ https://github.com/Intmanxzx/nnsmith/releases/download/v0.1.2/nnsmith-0.1.2+autofusex.1-py3-none-any.whl",
]

[project.scripts]
afx = "autofusex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["afx*", "autofusex*"]

[tool.setuptools.package-data]
# Offline and cloud viewers share these prebuilt assets.
autofusex = ["fuzz/server/view/static/*"]
