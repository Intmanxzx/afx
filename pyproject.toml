[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autofusedebugger"
version = "0.1.2"
description = "CPU vs native Inductor NPU Autofuse per-kernel accuracy debugger"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
# NNSmith itself is not on PyPI under this name; install the local clone with
# `pip install -e /path/to/nnsmith` separately, this only pulls its own deps.
nnsmith = ["multipledispatch"]

[project.scripts]
autofusedebugger = "autofusedebugger.cli:main"
autofusedbg = "autofusedebugger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autofusedebugger*"]

[tool.setuptools.package-data]
# Non-.py data the package reads at runtime (not auto-included by
# setuptools): the ascendc NNSmith patch, applied transparently on first use
# by nnsmith_integration/_nnsmith_patch.py. Editable installs (`pip install
# -e .`, the way this project is always deployed so far) find this file via
# its real on-disk path regardless of this declaration, but a non-editable
# build (wheel/sdist) would silently drop it without this.
autofusedebugger = ["nnsmith_integration/patches/*.patch"]
