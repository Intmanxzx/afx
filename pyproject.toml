[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autofusedebugger"
version = "0.1.2"
description = "Autofuse debugging and reproducible CPU/NPU fuzz testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
# NNSmith source is prepared separately in an isolated environment.
nnsmith = ["multipledispatch"]

[project.scripts]
autofusedebugger = "autofusedebugger.cli:main"
autofusedbg = "autofusedebugger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autofusedebugger*"]

[tool.setuptools.package-data]
# Offline and cloud viewers share these prebuilt assets.
autofusedebugger = ["fuzz/view/static/*", "nnsmith_integration/patches/*.patch"]
