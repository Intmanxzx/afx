[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autofusedebugger"
version = "0.1.2"
description = "CPU vs native Inductor NPU Autofuse per-kernel accuracy debugger"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
# NNSmith itself is not on PyPI under this name; install the local clone with
# `pip install -e /path/to/nnsmith` separately, this only pulls its own deps.
nnsmith = ["multipledispatch"]

[project.scripts]
autofusedebugger = "autofusedebugger.cli:main"
autofusedbg = "autofusedebugger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autofusedebugger*"]
