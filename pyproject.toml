[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afx"
version = "0.1.2"
description = "Autofuse debugging and reproducible CPU/NPU fuzz testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.18,<5", "cryptography>=41"]

[project.optional-dependencies]
execution = ["numpy"]
# Execution libraries are installed into managed environments; legacy users can opt in.
nnsmith = ["multipledispatch"]

[project.scripts]
afx = "autofusedebugger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["afx*", "autofusedebugger*"]

[tool.setuptools.package-data]
# Offline and cloud viewers share these prebuilt assets.
autofusedebugger = ["fuzz/view/static/*", "nnsmith_integration/patches/*.patch", "nnsmith_integration/install_af_fuzz.sh"]
