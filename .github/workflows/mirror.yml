name: Mirror from GitCode

# GitCode is the source of truth: work is pushed there, and this repository is
# a read-only mirror plus the release host. Nothing here writes back.
#
# The mirror runs on a schedule rather than on push because GitCode cannot
# call into GitHub without a webhook receiver. 30 minutes is short enough that
# a release tag is picked up without a human, and workflow_dispatch covers the
# "I need it mirrored right now" case.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  # Overlapping mirrors would race on the same refs. Queue instead of cancel
  # so a run that is mid-push always finishes.
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://gitcode.com/xingzhixiong/Autofuse-Debugger.git

jobs:
  mirror:
    name: Mirror branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check mirror credentials
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -eu
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Configure MIRROR_TOKEN with Contents and Workflows write access to this repository"
            exit 1
          fi

      - name: Check out the mirror
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN cannot push changes to .github/workflows. The dedicated
          # token can mirror these files and its tag pushes trigger release.yml.
          token: ${{ secrets.MIRROR_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch GitCode
        run: |
          set -eu
          git remote add upstream "$UPSTREAM"
          git fetch --quiet --prune --tags --force upstream "+refs/heads/*:refs/remotes/upstream/*"

      - name: Push branches
        run: |
          set -eu
          # Fast-forward only. A divergence means someone committed straight to
          # the GitHub mirror, and overwriting that would destroy work that
          # exists in exactly one place.
          for ref in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/upstream); do
            if git rev-parse --verify --quiet "refs/remotes/origin/$ref" >/dev/null; then
              if ! git merge-base --is-ancestor "refs/remotes/origin/$ref" "refs/remotes/upstream/$ref"; then
                echo "::error::$ref diverged between GitCode and GitHub; refusing to overwrite"
                exit 1
              fi
            fi
            git push --quiet origin "refs/remotes/upstream/$ref:refs/heads/$ref"
          done

      - name: Push tags
        run: |
          set -eu
          git push --quiet origin --tags
