name: Release wheel

# Releases are cut from the GitHub mirror: GitCode stays the source of truth
# and this repository only ever receives mirrored refs, but GitHub is the
# forge that owns the Release attachment and the PyPI upload.
#
# GitCode's native Push mirror sends tags using a GitHub personal access token,
# which triggers this workflow. Failed runs can be rerun manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z) already present in this repository'
        required: true
        type: string

concurrency:
  # One run per tag. Two runs publishing the same wheel would race on the
  # Release asset and on PyPI; the script is idempotent but the second run
  # would still re-verify everything for nothing.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          # Passed through the environment: a workflow_dispatch input is
          # interpolated into the script verbatim, so it is validated here
          # instead of being pasted into a shell command.
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "release tag must contain numeric version segments" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Decide whether this tag is the one to release
        id: gate
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$TAG^{commit}")" ]; then
            echo "HEAD is not the tagged commit" >&2
            exit 1
          fi
          # Only the version the default branch declares may be released.
          # Without this the first mirror would publish every historical
          # v0.1.x tag, because release_wheel.py only compares the tag with
          # the pyproject.toml that the same tag contains.
          git fetch --quiet origin "$DEFAULT_BRANCH"
          current=$(git show FETCH_HEAD:pyproject.toml | python3 -c \
            'import sys,tomllib;print(tomllib.load(sys.stdin.buffer)["project"]["version"])') \
            || { echo "cannot read project.version from $DEFAULT_BRANCH" >&2; exit 1; }
          if [ "v$current" != "$TAG" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is not the current version ($current on $DEFAULT_BRANCH); skipping"
          else
            if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "tagged commit is not on $DEFAULT_BRANCH" >&2
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the wheel
        if: steps.gate.outputs.release == 'true'
        run: |
          set -eu
          python3 -m venv .release-venv
          .release-venv/bin/python -m pip install --quiet --upgrade pip
          .release-venv/bin/python -m pip install --quiet -r tools/release-requirements.txt
          # A build/ left over from an older distribution name leaks stale
          # packages into the wheel, which the smoke test then rejects.
          rm -rf build dist
          # Only the release-tooling tests run here. tests/fuzz still imports
          # modules that the "refactor fuzz into client daemon server modules"
          # commit moved, so it cannot gate a release until it is repaired.
          .release-venv/bin/python -m pytest -q tests/test_release_wheel.py
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          .release-venv/bin/python -m build --wheel --no-isolation
          .release-venv/bin/python -m twine check dist/*.whl

      - name: Smoke-test the installed wheel
        if: steps.gate.outputs.release == 'true'
        run: |
          set -eu
          # The smoke script fails if any model dependency is importable, so it
          # gets its own venv holding only the wheel and its base dependencies.
          python3 -m venv .wheel-smoke-venv
          .wheel-smoke-venv/bin/python -m pip install --quiet --force-reinstall dist/*.whl
          .wheel-smoke-venv/bin/python tools/fuzz/fuzz_wheel_smoke.py

      - name: Validate the tag, metadata and layout
        if: steps.gate.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          .release-venv/bin/python tools/release_wheel.py \
            --host github \
            --tag "$RELEASE_TAG" \
            --repository "${{ github.repository }}"

      - name: Publish to the GitHub Release and PyPI
        if: steps.gate.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          .release-venv/bin/python tools/release_wheel.py \
            --host github \
            --tag "$RELEASE_TAG" \
            --repository "${{ github.repository }}" \
            --publish
