name: Release wheel
on:
  push:
    tags:
      - 'v*'
concurrency:
  enable: true
  max: 1
  exceed-action: QUEUE
jobs:
  release:
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        identifier: source
        uses: checkout
      - name: Test and build tagged wheel
        run: |
          set -eu
          cd ${{ steps.source.outputs.path }}
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          python3 -m venv .release-venv
          .release-venv/bin/python -m pip install -r tools/release-requirements.txt
          .release-venv/bin/python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          .release-venv/bin/python -m pytest -q tests/test_fuzz*.py tests/test_release_wheel.py
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          .release-venv/bin/python -m build --wheel --no-isolation
          .release-venv/bin/python -m twine check dist/*.whl
          python3 -m venv .wheel-smoke-venv
          .wheel-smoke-venv/bin/python -m pip install --force-reinstall dist/*.whl
          .wheel-smoke-venv/bin/python tools/fuzz_wheel_smoke.py
          TAG=$(git describe --tags --exact-match HEAD)
          .release-venv/bin/python tools/release_wheel.py --tag "$TAG" --repository niuyuhu/Autofuse-Debugger
      - name: Publish identical wheel to Release and PyPI
        env:
          GITCODE_RELEASE_TOKEN: ${{ secrets.GITCODE_RELEASE_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -eu
          cd ${{ steps.source.outputs.path }}
          TAG=$(git describe --tags --exact-match HEAD)
          .release-venv/bin/python tools/release_wheel.py --tag "$TAG" --repository niuyuhu/Autofuse-Debugger --publish
