services:
  app:
    build: .
    image: autofusedbg-fuzz:0.1.2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
# Linux host networking keeps the app's mandatory 127.0.0.1:8090 bind.
# Install a TLS reverse proxy separately (see Caddyfile), or use the same pip
# package + systemd when Docker is unavailable. Do not publish port 8090 publicly.
